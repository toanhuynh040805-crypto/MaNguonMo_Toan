name: Import licensed real product photographs

on:
  push:
    paths:
      - 'scripts/download_real_product_photos.py'
      - 'resources/data/real_product_photos.json'
      - '.github/workflows/download-product-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-real-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Download Wikimedia Commons real photography
        run: python scripts/download_real_product_photos.py
      - name: Commit real photo files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/real-products/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle 15 real CC-licensed Wikimedia product photographs"
            git push origin HEAD:main
          else
            echo "Real photos already committed."
          fi
